# Rules disabled because they are genuinely wrong for this codebase:
disabled_rules:
  # `static_over_final_class` flags `override class func` in our final
  # URLProtocol subclass (NetworkSilenceTests). Overrides of a superclass
  # `class func` MUST stay `class func` — `static` does not compile — so the
  # rule's suggestion is impossible to apply here.
  - static_over_final_class

opt_in_rules:
  - closure_spacing
  - explicit_init
  - force_unwrapping
  - implicit_return
  - redundant_nil_coalescing
  - trailing_closure

excluded:
  - Packages/*/.build
  - DerivedData
  - vendor # third-party fastlane Swift, not ours to lint

# Thresholds relaxed from defaults where the default misfires on idiomatic,
# already-reviewed code (see commit message for per-rule rationale):
cyclomatic_complexity:
  # MediaKind.init?(uti:) is a flat 11-arm mapping switch — high arm count, no
  # real branching complexity. Default warn=10 misclassifies it.
  warning: 15
large_tuple:
  # CleaningPipeline.InputItem is a labeled 3-field work item; a tuple typealias
  # is clearer here than a one-off struct.
  warning: 3
function_body_length:
  # AVPassthroughCleaner.clean is one cohesive AVAssetWriter passthrough
  # pipeline (62 lines); splitting it would force non-Sendable AV reader/writer
  # objects across isolation boundaries under Swift 6 strict concurrency.
  warning: 70
function_parameter_count:
  # LivePhotoCleaner.cleanPair takes still+out, video+out, identifier, prefs (6).
  warning: 6

custom_rules:
  forbidden_addImageFromSource:
    name: "ImageIO leak risk"
    regex: "CGImageDestinationAddImageFromSource"
    message: "Use CGImageDestinationAddImage with explicit kCFNull properties — see PLAN.md §4.2"
    severity: error
