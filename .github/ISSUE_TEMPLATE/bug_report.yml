name: Bug report
description: Report something in CleanShare that is broken or behaving incorrectly.
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to trigger the bug.
      placeholder: |
        1. Open the share sheet on a photo
        2. Tap CleanShare
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: e.g. iOS 18.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 15 Pro, iPad Air (5th gen)
    validations:
      required: true
