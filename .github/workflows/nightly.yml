name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz suite
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Run fuzz tests
        run: cd Packages/CleanShareCore && CLEANSHARE_RUN_FUZZ=1 swift test --filter FuzzTests

  nightly-beta:
    name: Nightly TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    needs: fuzz
    environment: release
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install build tools
        run: brew install xcodegen

      - name: Install Ruby gems
        run: bundle install --path vendor/bundle

      - name: Decode App Store Connect API key
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey.p8

      - name: Generate Xcode project
        run: ./scripts/generate-project.sh

      - name: Bump nightly build number
        run: bundle exec fastlane run increment_build_number build_number:"${GITHUB_RUN_NUMBER}"

      - name: Upload nightly TestFlight build
        run: bundle exec fastlane beta
