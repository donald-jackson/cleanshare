name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install build tools
        run: brew install xcodegen swiftformat swiftlint xcbeautify

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Generate Xcode project
        run: ./scripts/generate-project.sh

      - name: Build (iOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project CleanShare.xcodeproj \
            -scheme CleanShare \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer terminal

  privacy-regression:
    name: Privacy Regression
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install audit tools
        run: brew install exiftool ffmpeg

      - name: Run engine tests
        run: cd Packages/CleanShareCore && swift test

      - name: Verify metadata stripped
        run: make verify-strip

      - name: No trackers / no network calls
        run: bash scripts/check-no-trackers.sh
