name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint + Build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CleanShare is developed against the Swift 6.3 toolchain (Xcode 26). Its use
      # of the current concurrency model — e.g. Sendable system types such as
      # UNNotificationSettings crossing actor boundaries — does not compile under
      # the older Xcode 16 / Swift 6.0.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install build tools
        run: brew install xcodegen swiftformat swiftlint xcbeautify

      - name: SwiftFormat (lint)
        run: swiftformat --lint .

      - name: SwiftLint (strict)
        run: swiftlint --strict

      - name: Generate Xcode project
        run: ./scripts/generate-project.sh

      - name: Build (iOS, no signing)
        # Build against the generic iOS *device* SDK, not the Simulator. The
        # pinned Xcode 16 on GitHub's macos-15 runner doesn't have the iOS 18
        # simulator runtime installed, so a 'platform=iOS Simulator' destination
        # can't resolve. This is a pure compile-check (build, not run): it needs
        # no simulator runtime and verifies exactly the same thing.
        run: |
          set -o pipefail
          xcodebuild \
            -project CleanShare.xcodeproj \
            -scheme CleanShare \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer terminal

  privacy-regression:
    name: Privacy Regression
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CleanShare is developed against the Swift 6.3 toolchain (Xcode 26). Its use
      # of the current concurrency model — e.g. Sendable system types such as
      # UNNotificationSettings crossing actor boundaries — does not compile under
      # the older Xcode 16 / Swift 6.0.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install audit tools
        run: brew install exiftool ffmpeg

      - name: Run engine tests
        run: cd Packages/CleanShareCore && swift test

      - name: Verify metadata stripped
        run: make verify-strip

      - name: No trackers / no network calls
        run: bash scripts/check-no-trackers.sh
