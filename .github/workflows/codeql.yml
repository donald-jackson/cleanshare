name: CodeQL

on:
  schedule:
    - cron: "0 12 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "App/**/*.swift"
      - "ShareExtension/**/*.swift"
      - "Packages/**/*.swift"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
